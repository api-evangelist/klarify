aid: klarify
name: Klarify
description: 'Klarify is a San Francisco and Canada based mental-health technology
  company building an AI assistant, "Klara", for licensed therapists. The product handles
  the administrative and operational work around therapy rather than the therapy itself:
  an AI scribe that turns recorded sessions into structured clinical notes across 20+
  note formats, treatment-plan generation, clinical letters and assessment reports,
  insurance claim filing and form completion, session preparation, between-session
  client resources and worksheets, supervision prep, and visual session mindmaps, with
  support for many languages. Klarify also operates a public directory of licensed
  therapists and clinics across Canada and the US, where profiles, FAQs, and long-form
  articles are authored and verified by the clinicians themselves. The company states
  HIPAA, PIPEDA, PHIPA, and UK GDPR compliance, stores permanent records in Canada,
  deletes session audio after 14 days, and does not train models on customer session
  data. Founded in 2024 by Moody Abdul (CEO, previously co-founder of Circleback.ai)
  and Alexander Bergholm (CTO, formerly LLM infrastructure at Workday), Klarify is
  part of Y Combinator''s Spring 2026 batch. Klarify publishes no public developer
  API: its llms.txt explicitly marks paths under /api/ as internal infrastructure.'
